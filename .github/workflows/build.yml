name: Build

# Builds every app: the Wii's Homebrew Channel app (launcher/README.md), Vertrix.app for the Mac
# (mac/README.md), and the app for the Switch, the Wii U and the 3DS (consoles/README.md). Each is
# the menu and the four games recompiled from the originals. The games' executables, and the Mac's
# soundtrack, are downloaded from vertrixgame.com at build time (tools/fetch_mac_inputs.sh) and
# checked there; none of them are in the repository, and the apps carry none of the games' files.
# The Wii U's menu is also published as a bare .wuhb, and the 3DS's five programs as .cia titles
# (packed on the runner: makerom and bannertool need a newer glibc than the devkitARM image has).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'consoles/**'
      - 'mac/**'
      - 'shell/**'
      - 'launcher/**'
      - 'source/**'
      - 'vertrix1/**'
      - 'vertrix3/**'
      - 'libwiiinput'
      - 'libwiiupdate'
      - 'tools/dolxz'
      - 'Makefile'
      - 'wii-game/icon.png'
      - 'tools/console_art.py'
      - 'tools/fetch_mac_inputs.sh'
      - 'tools/unace_sfx.py'
      - 'tools/make_cia.sh'
      - 'tools/build_dolxz.sh'
      - 'tools/dol_align.py'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - console: wii
            image: devkitpro/devkitppc:latest
            packages: ppc-libmad
            app: build/app/apps/vertrix
            program: games/*.dol
          - console: switch
            image: devkitpro/devkita64:latest
            packages: switch-dev switch-sdl2 switch-libmad
            app: build/switch/sd/switch/vertrix
            program: games/*.nro
          - console: wiiu
            image: devkitpro/devkitppc:latest
            packages: wiiu-dev wiiu-sdl2 ppc-libmad
            app: build/wiiu/sd/wiiu/apps/vertrix
            program: games/*.rpx
          - console: 3ds
            image: devkitpro/devkitarm:latest
            packages: 3ds-dev 3ds-libmad
            app: build/3ds/sd/3ds/vertrix
            program: games/*.3dsx
    container: ${{ matrix.image }}
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential git curl unzip zip innoextract liblzma-dev \
            python3 python3-dev python3-venv >/dev/null
          # pkg.devkitpro.org sometimes answers 403 for a while; try again before giving up.
          for i in 1 2 3 4 5; do
            dkp-pacman -Syu --noconfirm --needed ${{ matrix.packages }} && break
            test "$i" -lt 5
            sleep $((i * 30))
          done
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --quiet 'capstone>=5,<6' pefile 'acefile==0.6.14' pillow
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache the downloads
        uses: actions/cache@v4
        with:
          path: inputs
          key: vertrix-wii-inputs-${{ hashFiles('tools/fetch_mac_inputs.sh', 'tools/unace_sfx.py') }}
      - name: Download the games
        run: PYTHON=/opt/venv/bin/python tools/fetch_mac_inputs.sh inputs
      - name: Build
        run: |
          make -j"$(nproc)" ${{ matrix.console }}-app-zip PYTHON=/opt/venv/bin/python \
            V1_EXE=inputs/vertrix1/VERTRIX.EXE \
            V12_EXE=inputs/vertrix2-v12/app/Vertrix2.exe \
            V3_EXE=inputs/vertrix3/app/Vertrix3.exe \
            V20_EXE=inputs/vertrix2/app/Vertrix2.exe \
            MUSIC="$PWD/inputs/music"
      - name: Check
        run: |
          app=${{ matrix.app }}
          ls -l "$app" "$app"/games
          test "$(ls "$app"/${{ matrix.program }} | wc -l)" -eq 4
          unzip -l build/vertrix-${{ matrix.console }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vertrix-${{ matrix.console }}
          path: build/vertrix-${{ matrix.console }}.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: build/vertrix-${{ matrix.console }}.zip
      - name: Keep the Wii U menu's .wuhb and the 3DS programs' .elf files
        if: matrix.console == 'wiiu' || matrix.console == '3ds'
        run: |
          mkdir -p extra
          case "${{ matrix.console }}" in
            wiiu) cp build/wiiu/launcher/vertrix.wuhb extra/ ;;
            3ds)
              cp build/3ds/launcher/vertrix.elf extra/vertrix.elf
              cp build/v1/3ds/vertrix1.elf build/v12/3ds/vertrix2-v12.elf \
                build/v20/3ds/vertrix2.elf build/v3/3ds/vertrix3.elf extra/
              cp -R build/game-data extra/game-data
              cp -R inputs/music extra/music ;;
          esac
      - uses: actions/upload-artifact@v4
        if: matrix.console == 'wiiu' || matrix.console == '3ds'
        with:
          name: vertrix-${{ matrix.console }}-extra
          path: extra/
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.console == 'wiiu'
        with:
          draft: true
          files: extra/vertrix.wuhb

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          brew install innoextract
          python -m pip install --quiet 'capstone>=5,<6' pefile 'acefile==0.6.14'
      - name: Cache the downloads
        uses: actions/cache@v4
        with:
          path: inputs
          key: vertrix-inputs-${{ hashFiles('tools/fetch_mac_inputs.sh', 'tools/unace_sfx.py') }}
      - name: Download the games and the soundtrack
        run: PYTHON=python tools/fetch_mac_inputs.sh inputs
      - name: Build
        run: |
          make -j"$(sysctl -n hw.ncpu)" mac-app-zip PYTHON=python \
            V1_EXE=inputs/vertrix1/VERTRIX.EXE \
            V12_EXE=inputs/vertrix2-v12/app/Vertrix2.exe \
            V3_EXE=inputs/vertrix3/app/Vertrix3.exe \
            V20_EXE=inputs/vertrix2/app/Vertrix2.exe \
            MAC_MUSIC="$PWD/inputs/music"
      - name: Check
        run: |
          app=build/mac/Vertrix.app
          codesign --verify --deep --strict "$app"
          for f in "$app/Contents/MacOS/Vertrix" "$app"/Contents/Helpers/*.app/Contents/MacOS/*; do
            lipo "$f" -verify_arch arm64 x86_64
          done
          test "$(ls "$app"/Contents/Helpers | wc -l)" -eq 4
          test "$(ls "$app"/Contents/Resources/Music/*/*.mp3 | wc -l)" -eq 50
      - uses: actions/upload-artifact@v4
        with:
          name: vertrix-mac
          path: build/vertrix-mac.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: build/vertrix-mac.zip

  cia:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vertrix-3ds-extra
          path: elfs
      - name: Tools
        run: |
          pip install --quiet pillow
          mkdir -p "$HOME/bin" /tmp/mr /tmp/bt
          curl -sSLf -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -sSLf -o /tmp/bannertool.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
          unzip -oq /tmp/makerom.zip -d /tmp/mr && install -m755 "$(find /tmp/mr -type f -name makerom | head -1)" "$HOME/bin/makerom"
          tar -xzf /tmp/bannertool.tar.gz -C /tmp/bt && install -m755 "$(find /tmp/bt -type f -name bannertool | head -1)" "$HOME/bin/bannertool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build the CIAs
        run: |
          mkdir -p build/3ds/launcher build/v1/3ds build/v12/3ds build/v20/3ds build/v3/3ds
          cp elfs/vertrix.elf build/3ds/launcher/
          cp elfs/vertrix1.elf build/v1/3ds/
          cp elfs/vertrix2-v12.elf build/v12/3ds/
          cp elfs/vertrix2.elf build/v20/3ds/
          cp elfs/vertrix3.elf build/v3/3ds/
          cp -R elfs/game-data build/game-data
          make 3ds-cia-zip MUSIC="$PWD/elfs/music"
          test "$(ls build/3ds/cia/*.cia | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        with:
          name: vertrix-3ds-cia
          path: build/3ds/cia/*.cia
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: build/vertrix-3ds-cia.zip
