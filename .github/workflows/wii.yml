name: Wii

# Builds the Homebrew Channel app (launcher/README.md): the launcher and the four games recompiled
# from the originals, each packed with dolxz. The games' executables are downloaded from
# vertrixgame.com at build time (tools/fetch_mac_inputs.sh) and checked there; none of them are in
# the repository, and the app carries none of the games' files.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'launcher/**'
      - 'vertrix1/**'
      - 'vertrix3/**'
      - 'source/**'
      - 'libwiiinput'
      - 'libwiiupdate'
      - 'tools/dolxz'
      - 'Makefile'
      - 'wii-game/icon.png'
      - 'tools/fetch_mac_inputs.sh'
      - 'tools/unace_sfx.py'
      - 'tools/build_dolxz.sh'
      - 'tools/dol_align.py'
      - '.github/workflows/wii.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential git curl unzip zip innoextract liblzma-dev \
            python3 python3-dev python3-venv >/dev/null
          dkp-pacman -S --noconfirm --needed ppc-libmad
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --quiet 'capstone>=5,<6' pefile 'acefile==0.6.14'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache the downloads
        uses: actions/cache@v4
        with:
          path: inputs
          key: vertrix-wii-inputs-${{ hashFiles('tools/fetch_mac_inputs.sh', 'tools/unace_sfx.py') }}
      - name: Download the games
        run: FETCH_MUSIC=0 PYTHON=/opt/venv/bin/python tools/fetch_mac_inputs.sh inputs
      - name: Build
        run: |
          make -j"$(nproc)" wii-app-zip PYTHON=/opt/venv/bin/python \
            V1_EXE=inputs/vertrix1/VERTRIX.EXE \
            V12_EXE=inputs/vertrix2-v12/app/Vertrix2.exe \
            V3_EXE=inputs/vertrix3/app/Vertrix3.exe \
            V20_EXE=inputs/vertrix2/app/Vertrix2.exe
      - name: Check
        run: |
          app=build/app/apps/vertrix
          test -s "$app/boot.dol"
          test "$(ls "$app"/games/*.dol | wc -l)" -eq 4
          unzip -l build/vertrix-wii.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vertrix-wii
          path: build/vertrix-wii.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/vertrix-wii.zip
